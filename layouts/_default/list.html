{{ define "main" }}
{{ with .Content }}<div class="taxonomy-intro">{{ . }}</div>{{ end }}
<h2 class="archive-title">{{ .Title }}</h2>
<div class="post-list">
  {{ range .Pages }}
    <article class="post-teaser">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    </article>
  {{ end }}
</div>
{{ end }}
